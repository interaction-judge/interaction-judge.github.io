name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Prepare static files
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p _site
          cp index.html style.css .nojekyll _site/
          cp -R assets _site/assets
          python3 - <<'PY'
          import os
          from pathlib import Path

          site_url = os.environ["SITE_URL"].rstrip("/")
          if not site_url.startswith("https://"):
              raise SystemExit("GitHub Pages did not provide an HTTPS site URL")
          for name in ("index.html", "assets/citation.bib"):
              path = Path("_site") / name
              path.write_text(path.read_text().replace("https://interaction-judge.github.io", site_url))
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
